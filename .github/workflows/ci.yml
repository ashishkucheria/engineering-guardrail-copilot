name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No Cloudflare account in CI: remote bindings (Workers AI) are off and the fake model is used.
      LOCAL_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated Worker types are up to date
        run: npm run types:check
      - run: npm run typecheck
      - run: npm test
      - name: Eval (rule engine, no network)
        run: npm run eval -- --config rules --strict
      - name: Build
        run: npm run build
      - name: Action bundle (dist/action) is up to date
        run: |
          npm run build:action
          git diff --exit-code -- dist/action || { echo "::error::dist/action is stale. Run npm run build:action and commit the result."; exit 1; }
      - name: API smoke test against a local server (fake model, no Cloudflare account, no AI calls)
        run: |
          printf 'LLM_MODE=fake\nDAILY_LLM_CALLS_APP=60\n' > .dev.vars
          npm run db:setup:local
          npx vite dev --port 5173 --strictPort > dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5173/api/users > /dev/null && break; sleep 1; done
          npm run smoke
      - name: Dev server log
        if: failure()
        run: cat dev.log || true
